<section class="min-h-screen px-4 py-8 md:px-8 animate__animated animate__fadeIn">
    <div class="mx-auto max-w-6xl rounded-[2rem] border border-white/10 bg-black/30 p-4 shadow-2xl backdrop-blur-md md:p-6">
        <div class="grid gap-6 lg:grid-cols-[1.7fr_1fr]">
        <div class="rounded-3xl border border-white/10 bg-black/25 p-6 text-white backdrop-blur-sm">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div>
                    <p class="text-sm uppercase tracking-[0.35em] text-green-300">Carrito</p>
                    <h1 class="mt-2 text-4xl font-bold">Tu pedido</h1>
                </div>

                <p-button routerLink="/public/menu" label="Seguir pidiendo" severity="secondary" />
            </div>

            <div class="mt-8 flex flex-col gap-4">
                <article
                    *ngFor="let item of items"
                    class="flex items-center justify-between gap-4 rounded-2xl border border-white/10 bg-white/10 p-4"
                >
                    <div>
                        <h2 class="text-xl font-medium">{{ item.name }}</h2>
                        <p class="text-sm text-white/70">Cantidad: {{ item.quantity }}</p>
                    </div>

                    <span class="text-lg font-semibold text-green-300">
                        {{ item.quantity * item.price | currency:'EUR' }}
                    </span>
                </article>
            </div>
        </div>

        <aside class="rounded-3xl border border-white/10 bg-white/12 p-6 text-white shadow-lg backdrop-blur-sm">
            <h2 class="text-2xl font-semibold">Resumen</h2>

            <div class="mt-6 flex flex-col gap-3 text-lg">
                <div class="flex items-center justify-between">
                    <span>Subtotal</span>
                    <span>{{ subtotal | currency:'EUR' }}</span>
                </div>

                <div class="flex items-center justify-between">
                    <span>Gastos de gestion</span>
                    <span>{{ 1.5 | currency:'EUR' }}</span>
                </div>

                <div class="flex items-center justify-between border-t border-white/10 pt-4 text-xl font-semibold">
                    <span>Total</span>
                    <span class="text-green-300">{{ subtotal + 1.5 | currency:'EUR' }}</span>
                </div>
            </div>

            <div class="mt-8 flex flex-col gap-3">
                <p-button label="Continuar pedido" styleClass="btn-green btn-green-dimensions w-full" />
                <p-button routerLink="/public/welcome" label="Volver al inicio" severity="secondary" />
            </div>
        </aside>
        </div>
    </div>
</section>
