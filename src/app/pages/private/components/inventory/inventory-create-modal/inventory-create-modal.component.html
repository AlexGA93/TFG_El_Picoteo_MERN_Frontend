<p-dialog
  [visible]="visible()"
  (visibleChange)="onDialogVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [dismissableMask]="true"
  header="Nueva elemento de Inventario"
  [style]="{ width: '32rem', maxWidth: '95vw' }"
>
 <p-toast />
 <form class="flex flex-col gap-4 pt-2" [formGroup]="inventoryForm" (ngSubmit)="onSubmit()">
    <!-- nombre -->
     <div class="flex flex-col gap-2">
        <label for="nombre" class="text-sm font-semibold">Nombre</label>
      <input
        id="nombre"
        type="text"
        formControlName="nombre"
        class="w-full rounded-lg border border-slate-300 px-3 py-2"
        placeholder="Sal Gorda"
      />
     </div>
    <!-- tipo -->
     <div class="flex flex-col gap-2">
        <label for="tipo" class="text-sm font-semibold">Tipo</label>
      <input
        id="tipo"
        type="text"
        formControlName="tipo"
        class="w-full rounded-lg border border-slate-300 px-3 py-2"
        placeholder="Ej. Sal"
      />
     </div>
    <!-- cantidad -->
     <div class="flex flex-col gap-2">
        <label for="unidades" class="text-sm font-semibold">Unidades</label>
      <input
        id="unidades"
        type="number"
        formControlName="unidades"
        class="w-full rounded-lg border border-slate-300 px-3 py-2"
        placeholder="Ej. 10"
      />
     </div>
    <!-- unidad -->
     <div class="flex flex-col gap-2">
        <label for="unidad" class="text-sm font-semibold">Unidad</label>
      <input
        id="unidades"
        type="text"
        formControlName="unidades"
        class="w-full rounded-lg border border-slate-300 px-3 py-2"
        placeholder="Ej. kg"
      />
     </div>
    <!-- proveedor -->
     <div class="flex flex-col gap-2">
        <label for="proveedor" class="text-sm font-semibold">Proveedores</label>
      <input
        id="proveedor"
        type="text"
        formControlName="proveedor"
        class="w-full rounded-lg border border-slate-300 px-3 py-2"
        placeholder="Ej. Supermercado XYZ"
      />
     </div>
    <!-- precio por unidad -->
     <div class="flex flex-col gap-2">
        <label for="precio" class="text-sm font-semibold">Precio por Unidad</label>
      <input
        id="precio"
        type="number"
        formControlName="precio"
        class="w-full rounded-lg border border-slate-300 px-3 py-2"
        placeholder="Ej. 1.50"
      />
     </div>
    <!-- fecha de registro -->
     <div class="flex flex-col gap-2">
        <label for="fecha" class="text-sm font-semibold">Fecha de Registro</label>
      <input
        id="fecha"
        type="date"
        formControlName="fecha"
        class="w-full rounded-lg border border-slate-300 px-3 py-2"
      />
     </div>
     <div class="flex justify-end gap-3 pt-2">
      <button
        type="button"
        class="p-ripple p-button p-component"
        (click)="onClose()"
      >
        Cancelar
      </button>
      <button
        type="submit"
        class="p-ripple p-button p-component p-button-info"
      >
        Guardar Producto
      </button>
    </div>
 </form>
</p-dialog>
