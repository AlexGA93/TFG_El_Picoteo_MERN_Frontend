<!-- Seccion de tarjetas de recetas -->
<div class="top-bar-card-r flex flex-row justify-between">

  <div class="top-bar-card-r__title flex flex-row my-3 p-0">

    <!-- icono -->
    <lucide-icon
      [img]="ChefHat"
      class="w-4 h-4 mr-2 title__icon top-bar-card-r__title--icon"
    ></lucide-icon>

    <!-- titulo -->
    <h1 class="title__text text-2xl flex text-center font-bold">
      {{ 'recipes.title' | translate }}
    </h1>

  </div>

  <button 
    class="top-bar-card-r__button"
    [routerLink]="['/private/recetas']"
  >
    {{ 'recipes.view_all' | translate }}
  </button>

</div>

<!-- ITERAMOS Y LLAMAMOS AL COMPONENTE CARTA -->
<div class="grid grid-flow-col auto-cols-max gap-6 sm:gap-8 overflow-x-auto md:grid-flow-row md:grid-cols-2 xl:grid-cols-6 place-items-center">

  @for (recipe of recipes().slice(0, 6); track $index) {
    <recipe-card [recipe]="recipe" />
  }

</div>
