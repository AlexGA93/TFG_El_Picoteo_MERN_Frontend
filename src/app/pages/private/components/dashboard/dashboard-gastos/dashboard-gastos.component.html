<!-- <h1 class="text-2xl font-bold mb-3">Gastos</h1> -->
  <div class="top-bar-card-g flex flex-row justify-between">
  <div class="top-bar-card-g__title flex flex-row my-3 p-0">
    <!-- icono -->
    <lucide-icon
      [img]="BanknoteX"
      class="w-4 h-4 mr-2 title__icon top-bar-card-g__title--icon"
    ></lucide-icon>
    <!-- titulo -->
    <h1 class="title__text text-2xl flex text-center font-bold">Ventas</h1>
  </div>
  <button class="top-bar-card-g__button" [routerLink]="['/private/gastos']">Ver Todas</button>
</div>
<div class="flex flex-col gap-4 sm:gap-5">
  @for (item of gastos(); track item.periodo) {
    <div class="flex items-center justify-between rounded-md border border-slate-700/40 bg-slate-800/30 px-3 py-3">
      <p class="text-sm font-medium">{{ item.periodo }}</p>
      <div class="text-right leading-tight">
        <p class="text-lg font-bold text-rose-400">{{ item.totalDinero }} €</p>
        <p class="text-xs text-slate-300">{{ item.numeroOrdenes }} ordenes</p>
      </div>
    </div>
  }
</div>
