<div class="top-bar-card-s flex flex-row justify-between">

  <div class="top-bar-card-s__title flex flex-row my-3 p-0">

    <!-- icono -->
    <lucide-icon
      [img]="Package"
      class="w-4 h-4 mr-2 title__icon top-bar-card-s__title--icon"
    ></lucide-icon>

    <!-- titulo -->
    <h1 class="title__text text-2xl flex text-center font-bold">
      {{ 'stock.title' | translate }}
    </h1>

  </div>

  <button
    class="top-bar-card-s__button"
    [routerLink]="['/private/stock']"
  >
    {{ 'common.view_all' | translate }}
  </button>

</div>

<!-- LISTADO -->
<div class="grid grid-flow-col auto-cols-max gap-6 sm:gap-8 overflow-x-auto md:grid-flow-row md:grid-cols-2 xl:grid-cols-6 place-items-center">

  @for (stockElement of stock().slice(0, 6); track $index) {
    <stock-card [stockElement]="stockElement" />
  }

</div>
