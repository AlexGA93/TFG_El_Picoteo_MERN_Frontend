<div
  class="menu-float absolute top-4 right-4 rounded-lg shadow-lg p-4 z-10 flex flex-col"
>
  <p-toast />

  <h2 class="text-lg font-bold mb-2">
    {{ 'dinning_room.menu.title' | translate }}
  </h2>

  <hr class="mb-4" />

  <form
    [formGroup]="menuForm"
    (ngSubmit)="onSubmit()"
    class="flex flex-col gap-3"
  >

    <!-- TIPO DE NODO -->
    <div class="flex flex-col gap-1">
      <label for="nodeType" class="font-semibold">
        {{ 'dinning_room.menu.node_type' | translate }}
      </label>

      <select
        id="nodeType"
        formControlName="nodeType"
        class="border rounded-md p-2"
      >
        <option value="">
          {{ 'dinning_room.menu.select_option' | translate }}
        </option>

        <option value="mesa">
          {{ 'dinning_room.menu.table' | translate }}
        </option>

        <option value="silla">
          {{ 'dinning_room.menu.chair' | translate }}
        </option>
      </select>
    </div>

    <!-- MESA -->
    @if (menuForm.controls.nodeType.value === "mesa") {

      <div class="flex flex-col gap-1">
        <label for="nodeLabel" class="font-semibold">
          {{ 'dinning_room.menu.table_label' | translate }}
        </label>

        <input
          id="nodeLabel"
          type="text"
          formControlName="nodeLabel"
          class="border rounded-md p-2"
          [placeholder]="'dinning_room.menu.table_placeholder' | translate"
        />
      </div>

    }

    <!-- SILLA -->
    @if (menuForm.controls.nodeType.value === "silla") {

      <div class="flex flex-col gap-1">
        <label for="parentTable" class="font-semibold">
          {{ 'dinning_room.menu.assigned_table' | translate }}
        </label>

        <select
          id="parentTable"
          formControlName="parentTable"
          class="border rounded-md p-2"
        >
          <option value="">
            {{ 'dinning_room.menu.select_table' | translate }}
          </option>

          @for (table of tables(); track table.id) {
            <option [value]="table.id">
              {{ table.label }}
            </option>
          }
        </select>
      </div>

      <div class="flex flex-col gap-1">
        <label for="numberOfChairsByTable" class="font-semibold">
          {{ 'dinning_room.menu.chairs_number' | translate }}
        </label>

        <input
          id="numberOfChairsByTable"
          type="number"
          formControlName="numberOfChairsByTable"
          class="border rounded-md p-2"
          min="1"
          max="10"
        />
      </div>

    }

    <!-- SUBMIT -->
    <button
      type="submit"
      class="w-full rounded-md bg-black text-white p-2"
    >
      {{ 'dinning_room.menu.submit' | translate }}
    </button>

  </form>
</div>
