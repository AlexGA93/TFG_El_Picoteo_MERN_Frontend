<article class="dashboard-parent">
  <!-- navbar -->
  <!-- <div class="dashboard-navbar">
    <private-navbar [section]="'dashboard'" />
  </div> -->

  <section class="dashboard-grid">
    <!-- seccion recetas -->
    <div class="section-title m-0 flex flex-row align-center gap-2">
      <lucide-icon name="chef-hat" class=""></lucide-icon>
      <h1 class="text-2xl m-0 p-0">Recetas</h1>
    </div>
    <div class="dashboard-div1">
      <dashboard-recetas [recipes]="dashboardRecipesData()" />
    </div>

    <!-- seccion stock -->
    <h1>Stock</h1>
    <div class="dashboard-div2">
      <dashboard-stock [stock]="dashboardStockData()" />
    </div>

    <!-- seccion inventario -->
    <h1>Inventario</h1>
    <div class="dashboard-div3">
      <dashboard-inventory [inventory]="dashboardInventoryData()" />
    </div>

    <!-- seccion ventas -->
    <h1>Ventas</h1>
    <div class="dashboard-div4">
      <dashboard-ventas />
    </div>

    <!-- seccion gastos -->
    <h1>Gastos</h1>
    <div class="dashboard-div5">
      <dashboard-gastos />
    </div>
  </section>
</article>
