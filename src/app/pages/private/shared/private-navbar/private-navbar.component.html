<nav class="navbar">
  <div class="navbar-info flex items-center gap-4">
    <lucide-icon name="chef-hat" [class]="sectionObject().class"></lucide-icon>
    <!-- <h1>{{ sectionObject() | json }}</h1> -->

    <div class="navbar-info__title">
      <div class="title-container flex flex-row flex-start content-center">
        <h1 class="text-2xl">{{ sectionObject().title | titlecase }}</h1>
        <img width="32" height="32" class="welcome-icon mx-2" src="../../../../assets/icons/icon_big_white.png" alt="alex-logo">
      </div>
      <p class="text-xl">{{ sectionObject().subtitle }}</p>
    </div>
  </div>

  

  <div class="action-buttons flex gap-2 items-center">
    <p-button
    type="button" 
      (click)="changeLanguage()" 
      pTooltip="cambiar idioma" 
      tooltipPosition="bottom"
      severity="info" 
      [rounded]="true"
      [text]="true"
      class="p-2"
    >
      <lucide-icon [img]="Languages" class="w-5 h-5"></lucide-icon>
    </p-button>
    <p-button 
      type="button" 
      (click)="navigateToMenu()" 
      [pTooltip]="'Menú'" 
      tooltipPosition="bottom"
      severity="info" 
      [rounded]="true"
      [text]="true"
      class="p-2"
    >
      <lucide-icon [img]="UtensilsCrossed" class="w-5 h-5"></lucide-icon>
    </p-button>
    
    <p-button 
      type="button" 
      (click)="navigateToDR()" 
      [pTooltip]="currentSection() | titlecase" 
      tooltipPosition="bottom"
      severity="info" 
      [rounded]="true"
      [text]="true"
      class="p-2"
    >
      <lucide-icon [img]="LayoutDashboard" class="w-5 h-5"></lucide-icon>
    </p-button>
    
    <p-button 
      type="button" 
      (click)="logOut()" 
      pTooltip="Cerrar sesión" 
      tooltipPosition="bottom"
      severity="danger" 
      [rounded]="true"
      [text]="true"
      class="p-2"
    >
      <lucide-icon [img]="LogOut" class="w-5 h-5"></lucide-icon>
    </p-button>
  </div>
</nav>
