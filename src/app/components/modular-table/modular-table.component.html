
<div class="table">
    <div class="title">
        <h4 class="title--text">
            {{ title | uppercase }}  
        </h4>
        <button 
        class="title--button btn btn-success"
        (click)="openModal('nuevo-inventario')"
        >Nuevo Registro</button>
    </div>
    
    <mat-form-field class="table__form">
      <mat-label>Filtro</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Introduce campo..."
        type="text"
        #input
      />
    </mat-form-field>
  
    <div class="mat-elevation-z8 table__table">
      <table mat-table [dataSource]="dataSource" matSort>
        <div *ngFor="let data of displayedColumns; let i = index">
          <ng-container matColumnDef="{{ data }}">
            <th class="table-header" mat-header-cell *matHeaderCellDef mat-sort-header>
              {{ data | uppercase | trimmed }}
            </th>
            <td mat-cell *matCellDef="let row">
              <ng-container [ngSwitch]="data">
                <div *ngSwitchDefault>{{ row[data] }}</div>
                <div *ngSwitchCase="'fecha'">{{ row[data] | date }}</div>
                <div *ngSwitchCase="'precio_unidad'">
                  {{ row[data] | currency : "USD" : "symbol" }}
                </div>
                <div *ngSwitchCase="'precio_total'">
                  {{ row[data] | currency : "USD" : "symbol" }}
                </div>
                <div *ngSwitchCase="'precio_producto'">
                  {{ row[data] | currency : "USD" : "symbol" }}
                </div>
                <div *ngSwitchCase="'acciones'" class="button-container">
                    <button class="btn btn-info">Editar</button>    
                    <button class="btn btn-danger">Borrar</button>  
                </div>
              </ng-container>
            </td>
          </ng-container>
        </div>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            No data matching the filter "{{ input.value }}"
          </td>
        </tr>
      </table>
      <mat-paginator
        [pageSizeOptions]="[5, 10, 25, 100]"
        aria-label="Select page of items"
      ></mat-paginator>
    </div>
  </div>
