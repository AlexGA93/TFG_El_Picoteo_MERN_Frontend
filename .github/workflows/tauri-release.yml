name: "Tauri Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Build Tauri App (Debian/Ubuntu and Windows)
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "App ${{ github.ref_name }}"
          releaseBody: "Nueva release automática"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-22.04' && '--bundles deb' || '--bundles nsis,msi' }}

  arch:
    name: Build Arch package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            nodejs npm \
            rustup \
            webkit2gtk-4.1 \
            gtk3
          rustup default stable

      - name: Install Node dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Build Tauri binary (release)
        run: |
          cd src-tauri
          cargo build --release

      - name: Build Arch package
        run: |
          mkdir -p packaging/arch
          cp src-tauri/target/release/app packaging/arch/elpicoteo-bin
          cp src-tauri/icons/128x128.png packaging/arch/elpicoteo.png
          useradd -m builder || true
          chown -R builder:builder "$PWD"
          su builder -c "cd '$PWD/packaging/arch' && makepkg -f --noconfirm"

      - name: Traceability info (commit and checksums)
        run: |
          echo "Release tag: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          sha256sum packaging/arch/*.pkg.tar.zst | tee packaging/arch/SHA256SUMS.txt

      - name: Upload Arch package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/SHA256SUMS.txt
